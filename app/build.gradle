plugins {
    id 'com.android.application'
}

def appVersionCode = 12
def appVersionName = '1.0.11'
def secureSigningScript = providers.gradleProperty('secure.signing').orNull
def secureSigningFile = secureSigningScript == null ? null : rootProject.file(secureSigningScript)

base {
    archivesName.set("${appVersionName}[${appVersionCode}]AtlasAppWindow")
}

android {
    namespace = 'com.mmwtl.atlasappwindow'
    compileSdk = 36

    defaultConfig {
        applicationId = 'com.mmwtl.atlasappwindow'
        minSdk = 30
        targetSdk = 36
        versionCode = appVersionCode
        versionName = appVersionName
        testInstrumentationRunner = 'android.test.InstrumentationTestRunner'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.tananaev:adblib:1.3'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'junit:junit:4.13.2'
}

tasks.withType(JavaCompile).configureEach {
    options.compilerArgs.addAll(['-Xlint:deprecation', '-Xlint:unchecked'])
}

if (secureSigningFile != null && secureSigningFile.isFile()) {
    apply from: secureSigningFile
}
